name: Perf vehicle bitmap

# TEMPORARY: measures the vehicle tile occupancy bitmap PR against its base. Removed before merge.
# Three parallel jobs each build the PR head and the PR base with identical flags and run both on the same runner,
# interleaved: the targeted benchmark (utils/debug_harness/perf_vehicle_bitmap.py: 2048x2048, ~40 trains and ~600 buses)
# twice, then the standard quick full test. Each job records PR - base per metric; the report job averages the three.

on:
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    name: Measure (run ${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    env:
      OTTD_CONTENT_DIR: ${{ github.workspace }}/content
      PYTHONUNBUFFERED: 1

    steps:
    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        path: pr

    - name: Checkout base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base

    - name: Install dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ccache cmake ninja-build \
          libcurl4-openssl-dev libfontconfig-dev libfreetype-dev libharfbuzz-dev libicu-dev \
          liblzma-dev liblzo2-dev libpng-dev libsdl2-dev libzstd-dev zlib1g-dev

    - name: Restore compiler cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: perf-vehicle-bitmap-ccache-${{ matrix.run }}-${{ github.sha }}
        restore-keys: |
          perf-vehicle-bitmap-ccache-${{ matrix.run }}-
          game-tests-ccache-

    - name: Build base and PR
      run: |
        # Same flags as game-tests.yml; vcpkg is not needed, system libraries are used.
        for side in base pr; do
          mv $side/vcpkg.json $side/vcpkg-disabled.json
          cmake -S $side -B $side/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DOPTION_USE_ASSERTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build $side/build --target openttd -j $(nproc)
        done
        ccache -s

    - name: Get OpenGFX
      run: |
        mkdir -p content/baseset
        curl -sSL https://cdn.openttd.org/opengfx-releases/7.1/opengfx-7.1-all.zip -o opengfx.zip
        unzip -q opengfx.zip -d content/baseset

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Build the benchmark game
      run: |
        # Built once by the PR binary and saved (no savegame change): every measurement loads the identical game.
        mkdir -p results
        python pr/utils/debug_harness/perf_vehicle_bitmap.py --exe "$GITHUB_WORKSPACE/pr/build/openttd" \
          --name bench_build --out results/bench_build.json --save bench.sav

    - name: Targeted benchmark x 3 (base, PR, PR, base, base, PR)
      run: |
        # The order alternates per round so that running first or second does not bias one side.
        for round in 1 2 3; do
          order="base pr"; [ "$round" = 2 ] && order="pr base"
          for side in $order; do
            python pr/utils/debug_harness/perf_vehicle_bitmap.py --exe "$GITHUB_WORKSPACE/$side/build/openttd" \
              --name "bench_${side}_${round}" --out "results/bench_${side}_${round}.json" --load bench.sav
          done
        done

    - name: Quick full test (base, PR)
      run: |
        for side in base pr; do
          OTTD_EXE="$GITHUB_WORKSPACE/$side/build/openttd" python pr/utils/debug_harness/full_test.py --profile quick \
            --name "quick_${side}" --out results/full --perf-report-only --save-baseline "results/quick_${side}.json" \
            || echo "::warning::quick full test on $side failed, see its summary"
        done

    - name: PR - base for this run
      run: |
        python3 - <<'EOF'
        import json, statistics
        from pathlib import Path
        r = Path("results")
        def load(p):
            return json.loads(p.read_text()) if p.exists() else {}
        out = {"run": ${{ matrix.run }}, "metrics": {}}
        bench = {side: [load(r / f"bench_{side}_{i}.json") for i in (1, 2, 3)] for side in ("base", "pr")}
        out["built"] = load(r / "bench_build.json")
        out["vehicles"] = {side: [b.get("vehicles") for b in bench[side]] for side in bench}
        out["cache_mismatches"] = {side: sum(len(b.get("cache_mismatches", [])) for b in bench[side]) for side in bench}
        for key in ("game_loop_ms_avg", "game_loop_ms_p95", "gl_train_ticks_ms_avg", "gl_train_ticks_ms_p95",
                    "gl_road_vehicle_ticks_ms_avg", "gl_road_vehicle_ticks_ms_p95", "mem_mb_max"):
            vals = {side: [b[key] for b in bench[side] if key in b] for side in bench}
            if vals["base"] and vals["pr"]:
                base, pr = statistics.mean(vals["base"]), statistics.mean(vals["pr"])
                out["metrics"][f"bench {key}"] = {"base": base, "pr": pr}
        quick = {side: load(r / f"quick_{side}.json") for side in ("base", "pr")}
        for key in ("game_loop_ms_avg", "game_loop_ms_p95", "gl_train_ticks_ms_avg", "gl_train_ticks_ms_p95",
                    "gl_road_vehicle_ticks_ms_avg", "gl_road_vehicle_ticks_ms_p95", "server_mem_mb_max"):
            if key in quick["base"] and key in quick["pr"]:
                out["metrics"][f"quick {key}"] = {"base": quick["base"][key], "pr": quick["pr"][key]}
        Path(f"diff-{out['run']}.json").write_text(json.dumps(out, indent=2))
        print(json.dumps(out, indent=2))
        EOF

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: perf-vehicle-bitmap-${{ matrix.run }}
        path: |
          diff-*.json
          results/*.json
          results/full/**/summary.txt
        if-no-files-found: warn
        retention-days: 14

  report:
    name: Report
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Download results
      uses: actions/download-artifact@v8
      with:
        pattern: perf-vehicle-bitmap-*
        path: results

    - name: Average PR - base over the runs
      run: |
        python3 - <<'EOF' > perf.md
        import json, statistics
        from pathlib import Path
        runs = [json.loads(p.read_text()) for p in sorted(Path("results").glob("*/diff-*.json"))]
        print("## Perf: vehicle tile occupancy bitmap (PR vs base)\n")
        print(f"{len(runs)} parallel runs; each run builds base and PR and runs both on the same runner. "
              "Targeted benchmark: single player, 2048x2048, up to 150 rail shuttle routes (one 6-car train each) "
              "and 60 bus routes with 35 buses each, built once and saved; each side loads the same save, 30s warmup, "
              "3 minutes real time sampled every 2s, 3 times per side (base, PR, PR, base, base, PR). "
              "Quick: the standard quick full test. Lower is better; memory in MB.\n")
        print("| metric | base | PR | PR - base | PR - base (%) | spread of % over runs |")
        print("|---|---:|---:|---:|---:|---|")
        keys = sorted({k for r in runs for k in r["metrics"]})
        for key in keys:
            rows = [r["metrics"][key] for r in runs if key in r["metrics"]]
            if not rows:
                continue
            base = statistics.mean(x["base"] for x in rows)
            pr = statistics.mean(x["pr"] for x in rows)
            pcts = [100 * (x["pr"] - x["base"]) / x["base"] for x in rows if x["base"]]
            pct = statistics.mean(pcts) if pcts else 0.0
            spread = f"{min(pcts):+.1f}% .. {max(pcts):+.1f}%" if pcts else "-"
            print(f"| {key} | {base:.3f} | {pr:.3f} | {pr - base:+.3f} | {pct:+.1f}% | {spread} (n={len(rows)}) |")
        print("\nBuilt per run: " + "; ".join(
            f"run {r['run']}: {r['built'].get('rail_routes')} rail + {r['built'].get('road_routes')} road routes"
            for r in runs if r.get("built")))
        print("\nVehicles per benchmark (base / PR): " +
              "; ".join(f"run {r['run']}: {r['vehicles']['base']} / {r['vehicles']['pr']}" for r in runs))
        print("\nCache check mismatches at the end of the benchmarks (base / PR): " +
              "; ".join(f"run {r['run']}: {r['cache_mismatches']['base']} / {r['cache_mismatches']['pr']}" for r in runs))
        EOF
        cat perf.md >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const marker = '<!-- perf-vehicle-bitmap -->';
          const body = marker + '\n' + fs.readFileSync('perf.md', 'utf8');
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const existing = comments.find(c => c.body && c.body.startsWith(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

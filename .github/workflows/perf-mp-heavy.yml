name: Perf (heavy multiplayer, TEMPORARY)

# TEMPORARY: heavy multiplayer comparison of this PR against main on Windows (MSVC). Removed before merge together with
# .github/perf/. Builds main (the PR's base) and this PR once each, builds one 4096x4096 world with ~8000 vehicles
# (cached), then 8 jobs on separate runners - 4 running main, 4 running this PR - each with a dedicated server and
# 4 headless clients. The report job averages each side and posts one PR comment (updated in place).

on:
  pull_request:
    branches:
    - main

concurrency:
  group: perf-mp-heavy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build (${{ matrix.side }})
    strategy:
      fail-fast: true
      matrix:
        side: [base, head]
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ matrix.side == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}

    - name: Setup vcpkg
      id: vcpkg
      uses: OpenTTD/actions/setup-vcpkg@v6

    - name: Configure developer command prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build
      shell: bash
      run: |
        mkdir build
        cd build
        cmake .. -GNinja -DVCPKG_TARGET_TRIPLET=x64-windows-static \
          -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.vcpkg-cmake }}" \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        grep -o '/Ob[0-3] ' compile_commands.json | sort | uniq -c
        echo "Compile commands with /GL: $(grep -c '/GL ' compile_commands.json)"
        cmake --build . --target openttd

    - name: Package
      shell: bash
      run: |
        mkdir pkg
        cp build/openttd.exe pkg/
        for d in lang ai game baseset scripts; do [ -d "build/$d" ] && cp -r "build/$d" pkg/; done

    - uses: actions/upload-artifact@v7
      with:
        name: perf-build-${{ matrix.side }}
        path: pkg
        retention-days: 3

  world:
    name: World (4096x4096, ~8000 vehicles)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Restore world
      id: cache
      uses: actions/cache@v6
      with:
        path: mp_world.sav
        key: perf-mp-world-${{ hashFiles('.github/perf/make_mp_world.py') }}

    - uses: actions/download-artifact@v8
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        name: perf-build-base
        path: bin

    - uses: actions/setup-python@v6
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        python-version: '3.13'

    - name: Build the world (with main)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p content/baseset
        curl -fsSL https://cdn.openttd.org/opengfx-releases/7.1/opengfx-7.1-all.zip -o opengfx.zip
        unzip -q opengfx.zip -d content/baseset
        python .github/perf/make_mp_world.py --exe bin/openttd.exe --content content --out mp_world.sav

    - uses: actions/upload-artifact@v7
      with:
        name: perf-mp-world
        path: mp_world.sav
        retention-days: 3

  measure:
    name: Measure ${{ matrix.side }} ${{ matrix.run }}
    needs: [build, world]
    strategy:
      fail-fast: false
      matrix:
        side: [base, head]
        run: [1, 2, 3, 4]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - name: Checkout (harness and scripts)
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - uses: actions/download-artifact@v8
      with:
        name: perf-build-${{ matrix.side }}
        path: bin

    - uses: actions/download-artifact@v8
      with:
        name: perf-mp-world
        path: world

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Server + 4 clients
      shell: bash
      run: |
        mkdir -p content/baseset results
        curl -fsSL https://cdn.openttd.org/opengfx-releases/7.1/opengfx-7.1-all.zip -o opengfx.zip
        unzip -q opengfx.zip -d content/baseset
        python .github/perf/mp_measure.py --exe bin/openttd.exe --content content --save world/mp_world.sav \
          --label ${{ matrix.side }} --out "results/mp-${{ matrix.side }}-${{ matrix.run }}.json"

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: perf-mp-${{ matrix.side }}-${{ matrix.run }}
        path: results
        retention-days: 7

  report:
    name: Report
    needs: measure
    if: always() && needs.measure.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - uses: actions/download-artifact@v8
      with:
        pattern: perf-mp-*-*
        path: results

    - name: Report
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 .github/perf/mp_report.py results report.md
        cat report.md >> "$GITHUB_STEP_SUMMARY"
        echo "" >> report.md
        echo "[Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> report.md
        id=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --paginate \
          --jq '.[] | select(.body | startswith("<!-- perf-mp-heavy -->")) | .id' | head -1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@report.md > /dev/null
        else
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -F body=@report.md > /dev/null
        fi

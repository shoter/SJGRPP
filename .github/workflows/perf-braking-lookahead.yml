name: Perf braking lookahead

# TEMPORARY: measures the "realistic braking lookahead cutoff" PR against its base. Removed before merge.
# Three parallel jobs each build the PR's base and head with the same flags (the head incrementally on top of the base
# build) and run both on the same runner, interleaved: base, PR, base, PR, for a targeted workload
# (utils/debug_harness/perf_rl_braking.py: long realistic braking routes, one save per job loaded by both builds) and the
# quick full test with realistic braking. The report job averages the jobs' PR - base differences into the run summary
# and one PR comment, updated in place.

on:
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    name: Bench ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    env:
      OTTD_CONTENT_DIR: ${{ github.workspace }}/content
      PYTHONUNBUFFERED: 1
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
    - name: Checkout PR (harness scripts)
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: pr

    - name: Checkout sources to build
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: src
        fetch-depth: 0

    - name: Install dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ccache cmake ninja-build \
          libcurl4-openssl-dev libfontconfig-dev libfreetype-dev libharfbuzz-dev libicu-dev \
          liblzma-dev liblzo2-dev libpng-dev libsdl2-dev libzstd-dev zlib1g-dev

    - name: Restore compiler cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: perf-braking-lookahead-ccache-${{ matrix.run }}-${{ github.sha }}
        restore-keys: perf-braking-lookahead-ccache-

    - name: Build base and PR
      run: |
        build() {   # $1 = commit, $2 = output dir
          git -C src checkout -q --force "$1"
          # vcpkg is not needed: system libraries are used.
          mv src/vcpkg.json src/vcpkg-disabled.json
          cmake -S src -B bld -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DOPTION_USE_ASSERTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build bld --target openttd -j $(nproc)
          mv src/vcpkg-disabled.json src/vcpkg.json
          mkdir -p "$2"
          cp bld/openttd "$2/"
          for d in lang ai game baseset scripts; do [ -d "bld/$d" ] && cp -r "bld/$d" "$2/"; done
          echo "$2: $(git -C src log --oneline -1)"
        }
        build "$BASE_SHA" bin/base
        build "$HEAD_SHA" bin/pr
        ccache -s

    - name: Get OpenGFX
      run: |
        sudo apt-get install -y --no-install-recommends libcurl4 libfontconfig1 libfreetype6 libharfbuzz0b liblzo2-2 libsdl2-2.0-0
        mkdir -p content/baseset
        curl -sSL https://cdn.openttd.org/opengfx-releases/7.1/opengfx-7.1-all.zip -o opengfx.zip
        unzip -q opengfx.zip -d content/baseset

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Prepare the targeted save (base build)
      run: |
        mkdir -p results
        python pr/utils/debug_harness/perf_rl_braking.py prepare --exe bin/base/openttd --save "$PWD/rl_bench.sav" \
          --root runs/prepare | tee prepare.log
        tail -n 1 prepare.log > results/prepare.json

    - name: Targeted workload (base, PR, base, PR)
      run: |
        for n in 1 2; do
          for label in base pr; do
            echo "::group::targeted $label $n"
            python pr/utils/debug_harness/perf_rl_braking.py run --exe "bin/$label/openttd" --save "$PWD/rl_bench.sav" \
              --out "results/${label}_${n}_targeted.json" --root "runs/${label}_${n}"
            echo "::endgroup::"
          done
        done

    - name: Quick full test with realistic braking (base, PR, base, PR)
      run: |
        for n in 1 2; do
          for label in base pr; do
            echo "::group::quick $label $n"
            OTTD_EXE="$PWD/bin/$label/openttd" python pr/utils/debug_harness/full_test.py --profile quick \
              --name "${label}_${n}_quick" --out results --perf-report-only \
              --setting vehicle.train_braking_model=1 || echo "::warning::quick $label $n failed"
            echo "::endgroup::"
          done
        done

    - name: PR - base for this job
      run: |
        python pr/utils/debug_harness/perf_rl_braking.py job --results results --out "results/job_${{ matrix.run }}.json"

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: perf-braking-lookahead-${{ matrix.run }}
        path: |
          results/*.json
          results/*/report.json
          results/*/summary.txt
        if-no-files-found: warn
        retention-days: 14

  report:
    name: Report
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Download results
      uses: actions/download-artifact@v8
      with:
        pattern: perf-braking-lookahead-*
        path: jobs

    - name: Average the jobs
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        python3 utils/debug_harness/perf_rl_braking.py report --jobs jobs --comment perf.md
        echo "" >> perf.md
        echo "[Workflow run]($RUN_URL) · head ${{ github.event.pull_request.head.sha }} vs base ${{ github.event.pull_request.base.sha }}" >> perf.md
        cat perf.md >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const marker = '<!-- perf-braking-lookahead -->';
          const body = fs.readFileSync('perf.md', 'utf8');
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const existing = comments.find(c => c.body && c.body.startsWith(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
